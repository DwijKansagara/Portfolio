<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <title>Dwij Kansagara Portfolio Story</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #10120f; color: #f2f3ea; font-family: Arial, Helvetica, sans-serif; }
    main { position: relative; width: 1080px; height: 1920px; padding: 100px 84px 90px; border-right: 22px solid #d3f36b; }
    header { display: flex; align-items: center; gap: 20px; font: 700 23px/1 "Courier New", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .mark { display: grid; place-items: center; width: 70px; height: 70px; background: #d3f36b; color: #10120f; font: 900 32px/1 Arial, sans-serif; }
    section { position: absolute; top: 50%; left: 84px; right: 84px; transform: translateY(-50%); }
    .label { margin: 0 0 34px; color: #d3f36b; font: 700 22px/1 "Courier New", monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 880px; margin: 0; font-size: 126px; line-height: .92; letter-spacing: -.065em; text-transform: uppercase; }
    h1 em { display: block; margin-top: 22px; color: #d3f36b; font-family: Georgia, "Times New Roman", serif; font-weight: 400; letter-spacing: -.05em; text-transform: none; }
    footer { position: absolute; left: 84px; right: 84px; bottom: 90px; padding-top: 30px; border-top: 2px solid #555b50; color: #d3f36b; font: 700 23px/1.35 "Courier New", monospace; letter-spacing: .025em; }
  </style>
</head>
<body>
  <main aria-label="Dwij Kansagara portfolio launch story">
    <header><span class="mark">d*</span><span>Dwij Kansagara</span></header>
    <section><p class="label">Now live</p><h1>My portfolio<em>is online.</em></h1></section>
    <footer>dwij-portfolio.antideploy.com</footer>
  </main>
</body>
</html>
